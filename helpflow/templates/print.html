<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etiquetas — HelpFlow</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"><script src="{{ url_for('static',filename='app.js') }}" defer></script></head><body class="print-page"><div class="print-toolbar"><a href="{{ url_for('main.points') }}">← Voltar</a><button class="button" type="button" data-print>Imprimir ou salvar PDF</button></div><div class="print-grid">{% for point in points %}<section class="print-label"><strong class="wordmark">HelpFlow.</strong><h1>{{ point.location.label }}</h1><p>{{ point.company.name }}</p><img src="{{ url_for('main.qr_png',point_id=point.id) }}" alt="QR do ambiente"><h2>Viu um problema?</h2><p>Escaneie para relatar.</p><code>{{ point.code }}</code><small>{{ base_url }}/scan</small></section>{% else %}<p>Nenhuma etiqueta ativa.</p>{% endfor %}</div></body></html>
